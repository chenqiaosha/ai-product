    - data:
        code: "import json\nfrom datetime import datetime, timezone, timedelta\n\n\
          def main(message: str, age: str) -> dict:\n    # ==================== 1.\
          \ 北京时间时段判断 ====================\n    beijing_tz = timezone(timedelta(hours=8))\n\
          \    hour = datetime.now(beijing_tz).hour\n\n    if 22 <= hour or hour <\
          \ 6:\n        time_context = \"深夜模式：回复更轻更短，不引导深度话题，以陪伴感为核心\"\n    elif 6\
          \ <= hour < 9:\n        time_context = \"早间模式：温和关心，不过度活跃\"\n    else:\n\
          \        time_context = \"日间模式：正常回应\"\n\n    # ==================== 2. 风险等级判断\
          \ ====================\n    red_keywords = [\n        \"不想活\", \"想死\", \"\
          自杀\", \"跳楼\", \"割腕\",\n        \"活着没意思\", \"如果我不在了\", \"遗书\", \"再见了\",\n\
          \        \"我走了大家会更好\", \"这是最后一次\", \"我撑不下去了\",\n        \"想吃药\", \"活不下去\"\
          , \"不想再坚持\"\n    ]\n    yellow_keywords = [\n        \"心情不好\", \"不开心\",\
          \ \"好烦\", \"郁闷\", \"烦躁\", \"难受\",\n        \"好累\", \"累\", \"没劲\", \"没意思\"\
          , \"无聊\", \"emo\",\n        \"好累不是身体累\", \"我是废物\", \"没人在乎我\",\n        \"\
          消失就好了\", \"我好多余\", \"我不配\",\n        \"算了无所谓了\", \"都是我的错\",\n        \"\
          一直emo\", \"emo很久了\", \"好久没开心\",\n        \"笑不出来\", \"麻木\"\n    ]\n    casual_patterns\
          \ = [\n        \"笑死\", \"尴尬死\", \"社死\", \"热死\", \"冷死\",\n        \"累死\"\
          , \"饿死\", \"忙死\", \"气死\", \"急死\",\n        \"丑死\", \"烦死\", \"难死\", \"无聊死\"\
          , \"困死\"\n    ]\n    real_red_flags = [\n        \"想死\", \"自杀\", \"不想活\"\
          , \"活不下去\",\n        \"撑不下去\", \"跳楼\", \"割腕\", \"遗书\"\n    ]\n\n    risk_level\
          \ = \"green\"\n    for kw in red_keywords:\n        if kw in message:\n\
          \            risk_level = \"red\"\n            break\n    if risk_level\
          \ == \"green\":\n        for kw in yellow_keywords:\n            if kw in\
          \ message:\n                risk_level = \"yellow\"\n                break\n\
          \n    if risk_level == \"red\":\n        has_real_red = any(word in message\
          \ for word in real_red_flags)\n        if not has_real_red:\n          \
          \  has_casual = any(pattern in message for pattern in casual_patterns)\n\
          \            if has_casual:\n                risk_level = \"green\"\n\n\
          \    # ==================== 3. 年龄段划分 ====================\n    try:\n  \
          \      age_int = int(age)\n    except (ValueError, TypeError):\n       \
          \ age_int = 99\n\n    if age_int <= 12:\n        age_group = \"10-12\"\n\
          \    elif age_int <= 15:\n        age_group = \"13-15\"\n    elif age_int\
          \ <= 18:\n        age_group = \"16-18\"\n    elif age_int <= 30:\n     \
          \   age_group = \"19-30\"\n    else:\n        age_group = \"30+\"\n\n  \
          \  # ==================== 返回所有字段 ====================\n    return {\n  \
          \      \"time_context\": time_context,\n        \"risk_level\": risk_level,\n\
          \        \"age_group\": age_group\n    }"
